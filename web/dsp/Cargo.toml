[package]
name = "reuse-streaming-dsp"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "LICENSE"
description = "Research streaming RE-USE STFT and overlap-add for WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustfft = { version = "=6.4.1", default-features = false }
wasm-bindgen = "=0.2.105"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
